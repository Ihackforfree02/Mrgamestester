<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MR GAMES | Clean Redesign</title>
  <script src="cloak_panic.js"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0c1116;
      color: white;
      overflow-x:hidden;
    }

    /* HEADER */
    header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 25px;
      background:rgba(0,0,0,0.45);
      backdrop-filter:blur(6px);
      position:sticky;
      top:0;
      z-index:2000;
      box-shadow:0 0 15px rgba(0,255,255,0.25);
    }
    .logo {
      font-size:2rem;
      font-weight:700;
      letter-spacing:2px;
      color:#00f2ff;
      text-shadow:0 0 10px #00f2ff;
    }
    .settings-btn {
      text-decoration:none;
      background:#00f2ff;
      padding:10px 18px;
      color:#0c1116;
      border-radius:10px;
      font-weight:600;
      box-shadow:0 0 10px #00f2ff;
    }

    /* HAMBURGER */
    .hamburger { cursor:pointer; width:35px; }
    .hamburger div {
      height:5px;
      background:#00f2ff;
      margin:6px 0;
      border-radius:5px;
      box-shadow:0 0 10px #00f2ff;
      transition:0.3s;
    }

    /* SIDE MENU */
    .side-menu {
      position:fixed;
      right:-320px;
      top:0;
      width:320px;
      height:100%;
      background:#0d161c;
      padding:40px 25px;
      transition:0.3s;
      z-index:3000;
      border-left:2px solid #00f2ff;
      box-shadow:-5px 0 20px rgba(0,255,255,0.25);
    }
    .side-menu a {
      display:block;
      color:#00f2ff;
      font-size:1.3rem;
      padding:12px 0;
      text-decoration:none;
      border-bottom:1px solid rgba(0,255,255,0.15);
    }

    /* GAME GRID */
    .game-grid {
      padding:40px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
      gap:30px;
    }
    .game-card {
      background:#111a20;
      border-radius:15px;
      padding:15px;
      box-shadow:0 0 12px rgba(0,255,255,0.15);
      transition:0.25s;
      position:relative;
      overflow:hidden;
    }
    .game-card:hover { transform:scale(1.04); }
    .game-card img {
      width:100%; height:150px; object-fit:cover;
      border-radius:10px;
      opacity:0.85;
    }
    .play-btn {
      position:absolute;
      top:50%; left:50%; transform:translate(-50%,-50%);
      background:#00f2ff;
      padding:10px 20px;
      border-radius:12px;
      color:#000;
      font-weight:bold;
      opacity:0;
      transition:0.3s;
    }
    .game-card:hover .play-btn { opacity:1; }
    .game-card p { margin-top:10px; font-size:1.1rem; }
    .game-card small { opacity:0.6; font-size:0.85rem; }

  </style>
</head>
<body>

<header>
  <div class="logo">MR GAMES</div>
  <div class="hamburger" onclick="toggleMenu()">
    <div></div><div></div><div></div>
  </div>
  <a href="settings.html" class="settings-btn">⚙ Settings</a>
</header>

<div id="sideMenu" class="side-menu">
  <a href="Games.html">🎮 Games</a>
  <a href="leaderboard.html">🏆 Leaderboard</a>
  <a href="about_us.html">ℹ️ About Us</a>
  <a href="record.html">📡 Records</a>
  <a href="useful_links.html">🔗 Useful Links</a>
  <a href="https://q6t1u8.ddx.edpuzzle.icu.cdn.cloudflare.net/">🛡 Proxy</a>
  <a href="https://luminal.cfd.cdn.cloudflare.net/">🌐 Luminal</a>
</div>

<section class="game-grid">
  <div class="game-card">
    <img src="images/placeholder.png" alt="Game Placeholder" />
    <div class="play-btn">▶ Play</div>
    <p>Minecraft</p>
    <small>Developer: Mojang</small>
  </div>

  <div class="game-card">
    <img src="images/placeholder.png" alt="Game Placeholder" />
    <div class="play-btn">▶ Play</div>
    <p>Cluster Rush</p>
    <small>Developer: Fantastico</small>
  </div>
</section>

<script>
  function toggleMenu(){
    let menu=document.getElementById("sideMenu");
    menu.style.right = menu.style.right === "0px" ? "-320px" : "0px";
  }
</script>

</body>
</html>
